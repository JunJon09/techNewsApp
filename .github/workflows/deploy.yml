name: Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    name: イメージビルド & GHCR push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # GHCR への push に必要

    steps:
      - uses: actions/checkout@v4

      # ARM64（ラズパイ3）向けのクロスコンパイルに必要
      - name: QEMU セットアップ
        uses: docker/setup-qemu-action@v3

      - name: Docker Buildx セットアップ
        uses: docker/setup-buildx-action@v3

      - name: GHCR ログイン
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: バックエンド イメージをビルド & push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          # amd64（Mac/サーバー）と arm64（ラズパイ3 64bit OS）向けにビルド
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/technewsapp-backend:latest
            ghcr.io/${{ github.repository_owner }}/technewsapp-backend:${{ github.sha }}
          # Buildx のキャッシュで2回目以降のビルドを高速化
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: フロントエンド イメージをビルド & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/technewsapp-frontend:latest
            ghcr.io/${{ github.repository_owner }}/technewsapp-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
