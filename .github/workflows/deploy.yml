name: Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    name: イメージビルド & GHCR push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # GHCR はリポジトリ名が小文字必須のため変換する
      - name: オーナー名を小文字に変換
        id: lower
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: QEMU セットアップ
        uses: docker/setup-qemu-action@v3

      - name: Docker Buildx セットアップ
        uses: docker/setup-buildx-action@v3

      - name: GHCR ログイン
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: バックエンド イメージをビルド & push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # provenance を無効化しないとマルチプラットフォームビルドでキャッシュの
          # blob 参照が壊れ "not_found" エラーが発生する
          provenance: false
          tags: |
            ghcr.io/${{ steps.lower.outputs.owner }}/technewsapp-backend:latest
            ghcr.io/${{ steps.lower.outputs.owner }}/technewsapp-backend:${{ github.sha }}
          # scope でバックエンド・フロントエンドのキャッシュを分離する
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: フロントエンド イメージをビルド & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ steps.lower.outputs.owner }}/technewsapp-frontend:latest
            ghcr.io/${{ steps.lower.outputs.owner }}/technewsapp-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
